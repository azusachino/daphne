[project]
name = "daphne"
version = "0.4.0"
description = "Telegram bot for converting raw media links into Telegram-friendly media"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "httpx>=0.28.1",
    "parth-dl>=1.0.1",
]

[project.scripts]
daphne = "daphne.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["daphne"]

[tool.uv]
package = true

# Present so ruff's upward config discovery stops here instead of picking up
# a parent checkout's pyproject.toml (e.g. when this repo is vendored inside
# another one) -- keeps local `ruff check .` matching what CI applies.
[tool.ruff]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

