apiVersion: v1
kind: ConfigMap
metadata:
  name: daphne-config
  namespace: harus-media
data:
  config.toml: |
    [app]
    telegram_api_url = "http://localhost:8081"
    video_upload_limit_mb = 256

    [rbac]
    public_commands = ["help"]

    [rbac.roles.admin]
    permissions = ["*"]

    [rbac.roles.default]
    permissions = ["convert_link"]

    [rbac.roles.standard]
    permissions = ["convert_link", "preview_video", "fetch_metadata", "extract_audio"]

    [rbac.roles.power_user]
    permissions = ["convert_link", "preview_video", "fetch_metadata", "extract_audio", "download_video"]

    [rbac.users]
    # Add your Telegram numeric user ID. Example:
    # 111111111 = "admin"

    [rbac.chats]
    # Add your chat/group IDs here. Example:
    # -1001111111111 = "power_user"
