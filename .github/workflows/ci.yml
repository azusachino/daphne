name: CI

on:
  push:
    branches: [ main, master, "feat/**", "fix/**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'

  test:
    name: Lock, lint & unit tests
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Match the committed lock's 7-day window; uv's default would rewrite it.
      UV_EXCLUDE_NEWER: P7D
      # Fail instead of silently re-locking if pyproject and uv.lock disagree.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Check lockfile
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Format check
        run: make fmt-check

      - name: Unit tests
        run: make test

  check:
    name: make check
    if: ${{ always() }}
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" && "$TEST_RESULT" != "skipped" ]]; then
            echo "Gate failed with state: $TEST_RESULT"
            exit 1
          fi
